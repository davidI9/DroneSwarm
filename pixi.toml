[workspace]
channels = ["robostack-lyrical", "conda-forge"]
name = "ros2-proy-prueba"
platforms = ["linux-64"]
version = "0.1.0"

[tasks]
build = "colcon build --symlink-install"
test = { cmd = "colcon test --event-handlers console_direct+ && colcon test-result --verbose", depends-on = ["build"] }
# pixi run drone 3
# pixi run drone 3 "-p spawn_x:=1.0 -p spawn_y:=0.0 -p spawn_z:=1.0"
drone = { cmd = "ros2 run swarm_drone drone --ros-args -p drone_id:={{ id }} {{ params }}", args = ["id", { arg = "params", default = "" }] }
# pixi run fake-hand            (estática)
# pixi run fake-hand animated   (abre y cierra el puño en bucle)
# pixi run fake-hand animated "-p period:=6.0"
fake-hand = { cmd = "ros2 run swarm_client fake_hand --ros-args -p mode:={{ mode }} {{ params }}", args = [{ arg = "mode", default = "static" }, { arg = "params", default = "" }] }
# pixi run swarm-view
# pixi run swarm-view "-p drone_timeout:=1.0 -p rate_hz:=20.0"
swarm-view = { cmd = "ros2 run swarm_client swarm_view --ros-args {{ params }}", args = [{ arg = "params", default = "" }] }
# pixi run router   (router de Zenoh, en su propia terminal antes que los demás procesos)
router = "ros2 run rmw_zenoh_cpp rmw_zenohd"
rviz = "rviz2 -d src/swarm_client/config/swarm.rviz"
# RViz2 en sistemas con un Mesa más nuevo que el del entorno (p. ej. Arch): el Mesa
# del sistema necesita la libdrm del sistema, no la del entorno pixi.
rviz-arch = { cmd = "rviz2 -d src/swarm_client/config/swarm.rviz", env = { QT_QPA_PLATFORM = "xcb", LD_PRELOAD = "/usr/lib/libdrm.so.2 /usr/lib/libdrm_amdgpu.so.1" } }

[dependencies]
ros-lyrical-desktop = ">=0.13.0,<0.14"
colcon-common-extensions = ">=0.3.0,<0.4"
ros-lyrical-ament-cmake-auto = ">=2.8.8,<3"
compilers = ">=2.0.0,<3"
pkg-config = ">=0.29.2,<0.30"
cmake = "<4"
ninja = ">=1.13.2,<2"
ros-lyrical-rviz2 = ">=15.2.6,<16"
ros-lyrical-rmw-zenoh-cpp = ">=0.10.6,<0.11"

[activation]
scripts = ["install/setup.sh"]

[activation.env]
RMW_IMPLEMENTATION = "rmw_zenoh_cpp"
